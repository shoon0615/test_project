<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시판</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>게시판</h1>
      <button id="new-post" class="primary" type="button">글쓰기</button>
    </header>
    <p id="status" role="status">게시글을 불러오는 중입니다.</p>
    <button id="retry" type="button" hidden>다시 불러오기</button>
    <ul id="posts" aria-label="게시글 목록"></ul>
  </main>

  <dialog id="detail" aria-labelledby="post-title">
    <h2 id="post-title">게시글</h2>
    <p id="post-date" class="muted"></p>
    <p id="post-content"></p>
    <p id="detail-status" role="status"></p>
    <div class="actions">
      <button id="close-detail" type="button" autofocus>닫기</button>
      <button id="edit-post" type="button" disabled>수정</button>
      <button id="delete-post" class="danger" type="button" disabled>삭제</button>
    </div>
  </dialog>

  <dialog id="editor" aria-labelledby="editor-title">
    <h2 id="editor-title">글쓰기</h2>
    <form id="post-form">
      <fieldset id="editor-fields">
        <label for="title">제목</label>
        <input id="title" name="title" maxlength="100" required autofocus>
        <label for="content">본문</label>
        <textarea id="content" name="content" maxlength="5000" rows="7" required></textarea>
        <div class="actions">
          <button id="cancel-edit" type="button">취소</button>
          <button class="primary" type="submit">저장</button>
        </div>
      </fieldset>
      <p id="editor-status" role="status"></p>
    </form>
  </dialog>
</body>
</html>
